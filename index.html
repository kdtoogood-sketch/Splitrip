<title>Trip Kitty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column; trip "ticket" header, tabs, list, floating Add button. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#14201C; --muted:#5B6964; --line:#D5DDD9;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#D6EAE4;
  --gold:#C98407; --gold-soft:#FBEBC8;
  --pos:#1B7543; --neg:#B23C2A; --shadow:0 10px 30px -12px rgba(16,40,34,.28);
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#161F1C; --sunk:#1E2925; --ink:#E4EDE9; --muted:#93A29D; --line:#2A3632;
  --accent:#4CC1A4; --accent-ink:#04211A; --accent-soft:#173A31;
  --gold:#F0B33E; --gold-soft:#3A2E14;
  --pos:#5CCF8C; --neg:#F28672; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#161F1C; --sunk:#1E2925; --ink:#E4EDE9; --muted:#93A29D; --line:#2A3632;
  --accent:#4CC1A4; --accent-ink:#04211A; --accent-soft:#173A31;
  --gold:#F0B33E; --gold-soft:#3A2E14;
  --pos:#5CCF8C; --neg:#F28672; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:26px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block;transform:translateY(-2px)}
.back{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--neg);border:1.5px solid var(--neg)}
.btn.danger.armed{background:var(--neg);color:var(--surface)}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:14px}
.btn.block{width:100%}

/* ticket header */
.ticket{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px 20px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;box-shadow:var(--shadow)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket h2{font-size:24px;grid-column:1/-1;line-height:1.15;word-break:break-word}
.ticket .sub{opacity:.82;font-size:14px;grid-column:1/-1}
.ticket .rule{grid-column:1/-1;border-top:2px dashed currentColor;opacity:.35;margin:12px 0 8px}
.ticket .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.ticket .v{font-size:22px;font-weight:600}
.ticket .right{text-align:right}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:none;padding:10px 6px;border-radius:9px;font-weight:700;color:var(--muted);font-size:15px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group-h{padding:14px 16px 6px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.panel>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-size:16px;font-weight:600;white-space:nowrap;text-align:right}
.badge{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--accent-soft);color:var(--accent)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold);vertical-align:2px;margin-left:6px}

.empty{padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:34ch}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.section-h h3{font-size:18px}

.transfer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.panel>.transfer:first-child{border-top:0}
.transfer .who{font-weight:700;overflow-wrap:anywhere}
.transfer .who .arrow{color:var(--muted);font-weight:400;margin:0 4px}
.transfer .amt{font-size:18px;font-weight:600;color:var(--neg)}

.trip-card{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.trip-card h3{font-size:19px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.static{cursor:default}
.chip .x{border:0;background:none;padding:0 2px;font-size:16px;line-height:1;color:var(--muted)}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;padding:15px 24px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab .plus{font-size:22px;line-height:0;color:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:21px}
.x-btn{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.money{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:0 14px}
.money:focus-within{border-color:var(--accent)}
.money span{font-family:var(--f-num);font-size:22px;color:var(--muted)}
.money input{border:0;background:none;font:600 26px var(--f-num);color:var(--ink);padding:12px 8px;width:100%;min-width:0;outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.split-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:52px}
.srow:first-child{border-top:0}
.srow .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.srow .pv{font-size:14px;color:var(--muted);white-space:nowrap}
.srow.off .nm,.srow.off .pv{opacity:.4}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.mini{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:112px;flex:none;padding:0 8px}
.mini:focus-within{border-color:var(--accent)}
.mini input{border:0;background:none;width:100%;min-width:0;padding:8px 2px;font:600 15px var(--f-num);color:var(--ink);outline:none;text-align:right}
.mini span{color:var(--muted);font-family:var(--f-num);font-size:14px}
.status{font-size:14px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.status.ok{color:var(--pos)}.status.bad{color:var(--neg)}
.inline{display:flex;gap:8px}
.inline .input{flex:1}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot-actions{display:flex;flex-direction:column;gap:10px}
.pill{border:0;background:var(--sunk);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:14px}
.note{font-size:13px;color:var(--muted);padding:0 4px;margin:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div id="app"><div class="loading">Opening your trips…</div></div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toPaise=v=>{const n=parseFloat(String(v??'').replace(/[,₹\s]/g,''));return isFinite(n)?Math.round(n*100):0};
const inr=p=>{const neg=p<0;p=Math.abs(Math.round(p));const s=(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2});return (neg?'−':'')+'₹'+s};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const fmtDate=d=>{if(!d)return'';const [y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);const t=today();if(d===t)return'Today';const yd=new Date();yd.setDate(yd.getDate()-1);const ys=yd.getFullYear()+'-'+String(yd.getMonth()+1).padStart(2,'0')+'-'+String(yd.getDate()).padStart(2,'0');if(d===ys)return'Yesterday';return dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function errMsg(e){const c=e&&e.code;if(c==='invalid_argument'||c==='not_granted')return"You can view this trip but can't edit it.";if(c==='quota_exceeded')return'Storage is full. Delete an old trip to make room.';return"Couldn't save. Check your connection and try again."}

/* ---------- money maths (all in paise) ---------- */
function lrm(total,weights){const ids=Object.keys(weights).filter(k=>weights[k]>0);const W=ids.reduce((a,k)=>a+weights[k],0);const out={};if(!W||total<=0)return out;let used=0;const fr=[];ids.forEach(k=>{const raw=total*weights[k]/W;const f=Math.floor(raw);out[k]=f;used+=f;fr.push([k,raw-f])});fr.sort((a,b)=>b[1]-a[1]);for(let i=0;i<total-used;i++)out[fr[i%fr.length][0]]++;return out}
function shareOf(e){if(e.kind==='settle')return{[e.to]:e.amount};if(e.mode==='percent')return lrm(e.amount,e.pct||{});if(e.mode==='exact')return{...(e.exact||{})};const w={};(e.include||[]).forEach(id=>w[id]=1);return lrm(e.amount,w)}
function compute(trip,exps){const ids=trip.members.map(m=>m.id);const paid={},share={},net={};ids.forEach(i=>{paid[i]=0;share[i]=0;net[i]=0});let total=0;
  exps.forEach(e=>{const sh=shareOf(e);if(e.kind==='settle'){net[e.paidBy]=(net[e.paidBy]||0)+e.amount;net[e.to]=(net[e.to]||0)-e.amount;return}
    total+=e.amount;paid[e.paidBy]=(paid[e.paidBy]||0)+e.amount;net[e.paidBy]=(net[e.paidBy]||0)+e.amount;
    for(const[k,v]of Object.entries(sh)){share[k]=(share[k]||0)+v;net[k]=(net[k]||0)-v}});
  return{paid,share,net,total}}
function settleUp(net){const cr=[],dr=[];for(const[id,v]of Object.entries(net)){if(v>0)cr.push([id,v]);else if(v<0)dr.push([id,-v])}cr.sort((a,b)=>b[1]-a[1]);dr.sort((a,b)=>b[1]-a[1]);const t=[];let i=0,j=0;while(i<dr.length&&j<cr.length){const a=Math.min(dr[i][1],cr[j][1]);if(a>0)t.push({from:dr[i][0],to:cr[j][0],amount:a});dr[i][1]-=a;cr[j][1]-=a;if(!dr[i][1])i++;if(!cr[j][1])j++}return t}

/* ---------- storage: Firestore REST (propdesk-f50e0) + offline cache on this phone ---------- */
const FB={project:'propdesk-f50e0',apiKey:'',root:'personal/trip-kitty'};
const FS_BASE='https://firestore.googleapis.com/v1/projects/'+FB.project+'/databases/(default)/documents/';
function fsUrl(path,params){const p=[];if(FB.apiKey)p.push('key='+encodeURIComponent(FB.apiKey));if(params)p.push(params);return FS_BASE+path+(p.length?'?'+p.join('&'):'')}
async function fsList(col){const out=[];let tok='';do{const r=await fetch(fsUrl(col,'pageSize=300'+(tok?'&pageToken='+encodeURIComponent(tok):'')));if(!r.ok)throw{status:r.status};const j=await r.json();
  (j.documents||[]).forEach(d=>{try{const o=JSON.parse(d.fields.json.stringValue);o.id=d.name.split('/').pop();out.push(o)}catch(e){}});tok=j.nextPageToken||''}while(tok);return out}
async function fsSet(path,obj){const r=await fetch(fsUrl(path),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{json:{stringValue:JSON.stringify(obj)}}})});if(!r.ok)throw{status:r.status}}
async function fsDel(path){const r=await fetch(fsUrl(path),{method:'DELETE'});if(!r.ok&&r.status!==404)throw{status:r.status}}

function SyncStore(){
  const KEY='tripkitty.v2';let cache={trips:{},exps:{}},outbox=[];
  try{const c=JSON.parse(lsGet(KEY)||'null');if(c&&c.trips)cache=c}catch(e){}
  try{const o=JSON.parse(lsGet(KEY+'.outbox')||'[]');if(Array.isArray(o))outbox=o}catch(e){}
  const persist=()=>{lsSet(KEY,JSON.stringify(cache));lsSet(KEY+'.outbox',JSON.stringify(outbox))};
  let tCb=null,eCb=null,eTid=null,lastT=null,lastE=null,gen=0,flushing=false,pulling=false;
  const tripPath=id=>FB.root+'/trips/'+id,expCol=tid=>FB.root+'/trips/'+tid+'/expenses';
  function emitT(force){if(!tCb)return;const l=Object.values(cache.trips);const s=JSON.stringify(l);if(!force&&s===lastT)return;lastT=s;tCb(l)}
  function emitE(force){if(!eCb||!eTid)return;const l=Object.values(cache.exps[eTid]||{});const s=JSON.stringify(l);if(!force&&s===lastE)return;lastE=s;eCb(l)}
  function applyOp(op){if(op.k==='trip'){if(op.del){delete cache.trips[op.id];delete cache.exps[op.id]}else cache.trips[op.id]=op.data}
    else{const m=cache.exps[op.tid]||(cache.exps[op.tid]={});if(op.del)delete m[op.id];else m[op.id]=op.data}}
  function setSync(st){const v={state:st,pending:outbox.length};if(S.sync.state!==v.state||S.sync.pending!==v.pending){S.sync=v;render()}}
  function queue(op){op=JSON.parse(JSON.stringify(op));gen++;applyOp(op);outbox.push(op);persist();setSync('syncing');emitT();emitE();flush();return Promise.resolve()}
  async function flush(){if(flushing)return;flushing=true;
    try{while(outbox.length){const op=outbox[0];
        if(op.k==='trip'){if(op.del){const ex=await fsList(expCol(op.id));for(const e of ex)await fsDel(expCol(op.id)+'/'+e.id);await fsDel(tripPath(op.id))}else await fsSet(tripPath(op.id),op.data)}
        else{const p=expCol(op.tid)+'/'+op.id;if(op.del)await fsDel(p);else await fsSet(p,op.data)}
        outbox.shift();gen++;persist()}
      setSync('ok')}
    catch(e){setSync(e&&(e.status===401||e.status===403)?'denied':'offline')}
    finally{flushing=false}}
  async function pull(){if(pulling)return;if(outbox.length){await flush();if(outbox.length)return}
    pulling=true;const g=gen,tid=eTid;
    try{const trips=await fsList(FB.root+'/trips');let ex=null;if(tid)ex=await fsList(expCol(tid));
      if(g!==gen)return; // a local change happened mid-fetch; next poll picks it up
      const tm={};trips.forEach(t=>tm[t.id]=t);cache.trips=tm;
      if(tid){const m={};ex.forEach(e=>m[e.id]=e);cache.exps[tid]=m}
      outbox.forEach(applyOp);persist();setSync('ok');emitT();emitE(tid===eTid&&eTid&&lastE===null)}
    catch(e){setSync(e&&(e.status===401||e.status===403)?'denied':'offline');if(eTid&&lastE===null)emitE(true);if(lastT===null)emitT(true)}
    finally{pulling=false}}
  setInterval(()=>{if(!document.hidden)pull()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  window.addEventListener('online',()=>pull());
  return{
    retry(){pull()},
    watchTrips(cb){tCb=cb;lastT=null;if(Object.keys(cache.trips).length)emitT(true);pull();return()=>{tCb=null}},
    watchExpenses(tid,cb){eTid=tid;eCb=cb;lastE=null;if(cache.exps[tid])emitE(true);pull();return()=>{if(eTid===tid){eTid=null;eCb=null}}},
    saveTrip(t){return queue({k:'trip',id:t.id,data:t})},
    deleteTrip(id){return queue({k:'trip',id,del:true})},
    saveExpense(tid,e){return queue({k:'exp',tid,id:e.id,data:e})},
    deleteExpense(tid,id){return queue({k:'exp',tid,id,del:true})}}}

/* ---------- state ---------- */
let ST=null,unsubE=null,F=null,firstTrips=true;
const S={ready:false,trips:[],tripId:null,exps:[],expsLoaded:false,tab:'exp',sync:{state:'syncing',pending:0}};
const trip=()=>S.trips.find(t=>t.id===S.tripId);
const mname=(t,id)=>(t.members.find(m=>m.id===id)||{}).name||'Someone';

function boot(){
  ST=SyncStore();S.ready=true;
  ST.watchTrips(list=>{S.trips=list.filter(t=>t&&Array.isArray(t.members)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(firstTrips){firstTrips=false;const last=lsGet('tripkitty.last');if(last&&S.trips.find(t=>t.id===last)){openTrip(last);return}}
    if(S.tripId&&!trip())closeTrip();else render()});
  render();
}
function syncPill(){const s=S.sync;const map={ok:['Synced','pos'],syncing:['Syncing…','muted'],offline:['Offline'+(s.pending?' · '+s.pending+' waiting':''),'neg'],denied:['Firebase refused','neg']};const[l,c]=map[s.state]||map.syncing;
  return `<button class="pill ${c}" onclick="ST&&ST.retry()" title="Tap to sync now">● ${l}</button>`}
function openTrip(id){S.tripId=id;S.exps=[];S.expsLoaded=false;S.tab='exp';lsSet('tripkitty.last',id);if(unsubE)unsubE();unsubE=ST.watchExpenses(id,l=>{S.exps=l;S.expsLoaded=true;render()});render();window.scrollTo(0,0)}
function closeTrip(){if(unsubE)unsubE();unsubE=null;S.tripId=null;S.exps=[];lsSet('tripkitty.last',null);render()}
function setTab(t){S.tab=t;render()}

/* ---------- views ---------- */
function render(){const app=$('app');
  if(!S.ready){app.innerHTML='<div class="loading">Opening your trips…</div>';return}
  app.innerHTML=S.tripId&&trip()?tripView():homeView();
  const fab=document.getElementById('fab');
}
function homeView(){
  const cards=S.trips.map(t=>`<button class="trip-card" onclick="openTrip('${t.id}')">
      <span class="label">${t.createdAt?new Date(t.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}</span>
      <h3>${esc(t.name)}</h3>
      <span class="muted">${t.members.length} ${t.members.length===1?'person':'people'} · ${esc(t.members.map(m=>m.name).join(', '))}</span>
    </button>`).join('');
  return `<div class="topbar"><div class="brand"><h1>Trip Kitty</h1><span class="dot" aria-hidden="true"></span></div>
      <div class="inline" style="align-items:center">${syncPill()}${S.trips.length?'<button class="btn sm" onclick="openNewTrip()">+ New trip</button>':''}</div></div>
    ${S.trips.length?`<div style="display:flex;flex-direction:column;gap:10px">${cards}</div>`:
    `<div class="panel"><div class="empty"><div class="badge gold" style="width:52px;height:52px;font-size:22px">₹</div>
      <h3>Start your first trip</h3><p>Add the people on the trip, log who paid for what, and see exactly who owes whom at the end.</p>
      <button class="btn" onclick="openNewTrip()">+ New trip</button></div></div>`}
    `;
}
function tripView(){const t=trip();const c=compute(t,S.exps);const n=t.members.length;
  const expCount=S.exps.filter(e=>e.kind!=='settle').length;
  let body='';
  if(S.tab==='exp')body=expensesTab(t);else if(S.tab==='bal')body=balancesTab(t,c);else body=peopleTab(t,c);
  return `<div class="topbar"><button class="back" onclick="closeTrip()">‹ Trips</button>
      <div class="inline" style="align-items:center">${syncPill()}<button class="btn sm ghost" onclick="openSettle()">Settle up</button></div></div>
    <section class="ticket">
      <h2>${esc(t.name)}</h2>
      <div class="sub">${esc(t.members.map(m=>m.name).join(' · '))}</div>
      <div class="rule"></div>
      <div><div class="k">Total spent</div><div class="v num">${inr(c.total)}</div></div>
      <div class="right"><div class="k">Per head</div><div class="v num">${inr(n?Math.round(c.total/n):0)}</div></div>
      <div class="sub" style="margin-top:4px">${expCount} expense${expCount===1?'':'s'}</div>
    </section>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${S.tab==='exp'}" onclick="setTab('exp')">Expenses</button>
      <button role="tab" aria-selected="${S.tab==='bal'}" onclick="setTab('bal')">Balances</button>
      <button role="tab" aria-selected="${S.tab==='ppl'}" onclick="setTab('ppl')">People</button>
    </div>
    ${body}
    <button id="fab" class="fab" onclick="openExpense()"><span class="plus">+</span> Add expense</button>`;
}
function splitDesc(t,e){if(e.mode==='percent')return'split by %';if(e.mode==='exact')return'split by amounts';const k=(e.include||[]).length;return k===t.members.length?'split equally':'split equally among '+k}
function expensesTab(t){
  if(!S.expsLoaded)return'<div class="loading">Loading expenses…</div>';
  if(!S.exps.length)return`<div class="panel"><div class="empty"><h3>No expenses yet</h3><p>Tap <b>Add expense</b> for the first bill: who paid, how much, and who it's shared between.</p></div></div>`;
  const list=[...S.exps].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
  const groups={};list.forEach(e=>{(groups[e.date]||(groups[e.date]=[])).push(e)});
  return Object.entries(groups).map(([d,es])=>{const dayTotal=es.filter(e=>e.kind!=='settle').reduce((a,e)=>a+e.amount,0);
    return `<div class="panel"><div class="group-h"><span class="label">${esc(fmtDate(d))}</span><span class="label num">${dayTotal?inr(dayTotal):''}</span></div>
    ${es.map(e=>e.kind==='settle'?
      `<button class="row" onclick="openSettle('${e.id}')"><div class="badge gold">⇄</div><div class="main"><div class="t">${esc(mname(t,e.paidBy))} paid ${esc(mname(t,e.to))}<span class="tag">Settled</span></div><div class="m">Payment between members</div></div><div class="amt num">${inr(e.amount)}</div></button>`:
      `<button class="row" onclick="openExpense('${e.id}')"><div class="badge">${esc(initials(e.desc))}</div><div class="main"><div class="t">${esc(e.desc||'Expense')}</div><div class="m">${esc(mname(t,e.paidBy))} paid · ${splitDesc(t,e)}</div></div><div class="amt num">${inr(e.amount)}</div></button>`).join('')}</div>`}).join('');
}
function balancesTab(t,c){
  const rows=t.members.map(m=>{const v=c.net[m.id]||0;const cls=v>0?'pos':v<0?'neg':'muted';const lbl=v>0?'gets back':v<0?'owes':'settled up';
    return `<div class="row"><div class="av">${esc(initials(m.name))}</div><div class="main"><div class="t">${esc(m.name)}</div><div class="m">Paid ${inr(c.paid[m.id]||0)} · Share ${inr(c.share[m.id]||0)}</div></div><div class="amt"><div class="num ${cls}">${v?inr(Math.abs(v)):'—'}</div><div class="m ${cls}" style="font-size:12px">${lbl}</div></div></div>`}).join('');
  const tr=settleUp(c.net);
  const trHtml=tr.length?tr.map(x=>`<div class="transfer"><div><div class="who">${esc(mname(t,x.from))}<span class="arrow">pays</span>${esc(mname(t,x.to))}</div><div class="amt num">${inr(x.amount)}</div></div>
      <button class="btn sm" onclick="openSettle(null,'${x.from}','${x.to}',${x.amount})">Mark paid</button></div>`).join(''):
    `<div class="empty"><h3>All settled up</h3><p>${S.exps.length?'Nobody owes anybody right now.':'Balances will appear once you add expenses.'}</p></div>`;
  return `<div class="section-h"><h3>Who owes whom</h3><span class="label">${tr.length} payment${tr.length===1?'':'s'}</span></div>
    <div class="panel">${trHtml}</div>
    <p class="note">Simplified to the fewest payments. Tap <b>Mark paid</b> once the money has changed hands.</p>
    <div class="section-h"><h3>Balances</h3></div>
    <div class="panel">${rows}</div>`;
}
function peopleTab(t,c){
  return `<div class="panel">${t.members.map(m=>`<div class="row"><div class="av">${esc(initials(m.name))}</div><div class="main"><input class="input" id="mn_${m.id}" value="${esc(m.name)}" aria-label="Name" onchange="renameMember('${m.id}',this.value)" style="padding:8px 10px"></div>
      <button class="btn sm plain" onclick="removeMember('${m.id}')" aria-label="Remove ${esc(m.name)}">Remove</button></div>`).join('')}
    <div class="row"><div class="inline" style="flex:1"><input class="input" id="addMember" placeholder="Add a person" onkeydown="if(event.key==='Enter')addMember()"><button class="btn" onclick="addMember()">Add</button></div></div></div>
    <p class="note">New people are only included in expenses you add or edit after adding them.</p>
    <div class="section-h"><h3>Trip</h3></div>
    <div class="panel"><div class="row"><div class="main"><label class="label" for="tripName">Trip name</label><input class="input" id="tripName" value="${esc(t.name)}" onchange="renameTrip(this.value)" style="margin-top:6px"></div></div>
    <div class="row"><button id="delTrip" class="btn danger block" onclick="armDelete(this,deleteTrip,'Tap again to delete this trip and all its expenses')">Delete trip</button></div></div>`;
}

/* ---------- trip & member actions ---------- */
async function saveTrip(t){try{await ST.saveTrip(t)}catch(e){toast(errMsg(e));throw e}}
async function renameTrip(v){v=v.trim();const t=trip();if(!v||v===t.name)return;await saveTrip({...t,name:v});toast('Trip renamed')}
async function addMember(){const inp=$('addMember');const v=inp.value.trim();if(!v)return;const t=trip();
  if(t.members.some(m=>m.name.toLowerCase()===v.toLowerCase())){toast(v+' is already on this trip');return}
  await saveTrip({...t,members:[...t.members,{id:uid(),name:v}]});toast('Added '+v)}
async function renameMember(id,v){v=v.trim();const t=trip();if(!v){render();return}await saveTrip({...t,members:t.members.map(m=>m.id===id?{...m,name:v}:m)})}
function usedBy(id){return S.exps.some(e=>e.paidBy===id||e.to===id||(e.include||[]).includes(id)||(e.pct&&e.pct[id]>0)||(e.exact&&e.exact[id]>0))}
async function removeMember(id){const t=trip();if(usedBy(id)){toast(mname(t,id)+' is part of some expenses. Edit or delete those first.');return}
  if(t.members.length<=1){toast('A trip needs at least one person');return}
  await saveTrip({...t,members:t.members.filter(m=>m.id!==id)});toast('Removed')}
async function deleteTrip(){const id=S.tripId;closeTrip();try{await ST.deleteTrip(id);toast('Trip deleted')}catch(e){toast(errMsg(e))}}
function armDelete(btn,fn,msg){if(btn.classList.contains('armed')){fn();return}const old=btn.textContent;btn.classList.add('armed');btn.textContent=msg||'Tap again to delete';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=old}},4000)}

/* ---------- sheets ---------- */
function sheet(html){$('sheetRoot').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div></div>`;document.body.style.overflow='hidden'}
function closeSheet(){$('sheetRoot').innerHTML='';document.body.style.overflow='';F=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheetRoot').innerHTML)closeSheet()});

/* new trip */
let NT=[];
function openNewTrip(){NT=[];sheet(`<div class="sheet-h"><h2>New trip</h2><button class="x-btn" onclick="closeSheet()" aria-label="Close">×</button></div>
  <div class="field"><label class="label" for="ntName">Trip name</label><input class="input" id="ntName" placeholder="e.g. Goa, Oct 2026"></div>
  <div class="field"><label class="label" for="ntMember">Who's on the trip?</label>
    <div class="inline"><input class="input" id="ntMember" placeholder="Name" onkeydown="if(event.key==='Enter'){event.preventDefault();ntAdd()}"><button class="btn" onclick="ntAdd()">Add</button></div>
    <div class="chips" id="ntChips"></div></div>
  <button class="btn block" id="ntSave" onclick="createTrip()">Create trip</button>`);ntRender();setTimeout(()=>$('ntName').focus(),50)}
function ntAdd(){const i=$('ntMember');const parts=i.value.split(',').map(s=>s.trim()).filter(Boolean);parts.forEach(v=>{if(!NT.some(n=>n.toLowerCase()===v.toLowerCase()))NT.push(v)});i.value='';i.focus();ntRender()}
function ntDel(k){NT.splice(k,1);ntRender()}
function ntRender(){$('ntChips').innerHTML=NT.length?NT.map((n,k)=>`<span class="chip static">${esc(n)}<button class="x" onclick="ntDel(${k})" aria-label="Remove ${esc(n)}">×</button></span>`).join(''):'<span class="muted" style="font-size:14px">Add everyone, including yourself.</span>'}
async function createTrip(){const pending=$('ntMember').value.trim();if(pending)ntAdd();const name=$('ntName').value.trim();
  if(!name){toast('Give the trip a name');$('ntName').focus();return}if(!NT.length){toast('Add at least one person');return}
  const t={id:uid(),name,members:NT.map(n=>({id:uid(),name:n})),createdAt:Date.now()};
  try{await ST.saveTrip(t)}catch(e){toast(errMsg(e));return}closeSheet();S.trips=[t,...S.trips.filter(x=>x.id!==t.id)];openTrip(t.id)}

/* expense */
function openExpense(id){const t=trip();if(!t)return;const ms=t.members;const e=id?S.exps.find(x=>x.id===id):null;
  const lastPayer=lsGet('tripkitty.payer.'+t.id);
  F=e?{id:e.id,createdAt:e.createdAt,desc:e.desc||'',amount:(e.amount/100).toString(),paidBy:e.paidBy,mode:e.mode||'equal',include:new Set(e.mode==='equal'||!e.mode?(e.include||[]):ms.map(m=>m.id)),pct:{...(e.pct||{})},exact:Object.fromEntries(Object.entries(e.exact||{}).map(([k,v])=>[k,(v/100).toString()])),date:e.date||today()}
     :{desc:'',amount:'',paidBy:ms.find(m=>m.id===lastPayer)?lastPayer:ms[0].id,mode:'equal',include:new Set(ms.map(m=>m.id)),pct:{},exact:{},date:today()};
  sheet(`<div class="sheet-h"><h2>${e?'Edit expense':'Add expense'}</h2><button class="x-btn" onclick="closeSheet()" aria-label="Close">×</button></div>
    <div class="field"><label class="label" for="exAmt">Amount</label><div class="money"><span>₹</span><input id="exAmt" inputmode="decimal" placeholder="0" value="${esc(F.amount)}" oninput="F.amount=this.value;updateForm()"></div></div>
    <div class="field"><label class="label" for="exDesc">What was it for?</label><input class="input" id="exDesc" placeholder="Dinner, cab, hotel…" value="${esc(F.desc)}" oninput="F.desc=this.value"></div>
    <div class="field"><span class="label">Paid by</span><div class="chips" id="payChips">${ms.map(m=>`<button class="chip" aria-pressed="${m.id===F.paidBy}" onclick="setPayer('${m.id}')">${esc(m.name)}</button>`).join('')}</div></div>
    <div class="field"><span class="label">Split</span>
      <div class="seg" id="modeSeg">${[['equal','Equally'],['percent','By %'],['exact','By amount']].map(([k,l])=>`<button aria-pressed="${F.mode===k}" onclick="setMode('${k}')">${l}</button>`).join('')}</div>
      <div id="splitBox"></div><div id="splitStatus" class="status"></div></div>
    <div class="field"><label class="label" for="exDate">Date</label><input class="input" type="date" id="exDate" value="${F.date}" onchange="F.date=this.value"></div>
    <div class="foot-actions"><button class="btn block" id="exSave" onclick="saveExpense()">${e?'Save changes':'Add expense'}</button>
      ${e?`<button class="btn danger block" onclick="armDelete(this,deleteExpense)">Delete expense</button>`:''}</div>`);
  renderSplit();if(!e)setTimeout(()=>$('exAmt').focus(),50)}
function setPayer(id){F.paidBy=id;document.querySelectorAll('#payChips .chip').forEach((b,i)=>b.setAttribute('aria-pressed',trip().members[i].id===id))}
function setMode(m){if(F.mode===m)return;const t=trip();const amt=toPaise(F.amount);
  if(m==='percent'&&!Object.values(F.pct).some(v=>parseFloat(v)>0)){const inc=[...F.include];const n=inc.length||t.members.length;const ids=inc.length?inc:t.members.map(x=>x.id);const base=Math.floor(10000/n);ids.forEach((id,i)=>F.pct[id]=((i===ids.length-1?10000-base*(n-1):base)/100).toString())}
  if(m==='exact'&&!Object.values(F.exact).some(v=>toPaise(v)>0)&&amt>0){const w={};(F.include.size?[...F.include]:t.members.map(x=>x.id)).forEach(id=>w[id]=1);const sh=lrm(amt,w);for(const[k,v]of Object.entries(sh))F.exact[k]=(v/100).toString()}
  F.mode=m;document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('onclick').includes("'"+m+"'")));renderSplit()}
function renderSplit(){const t=trip();const box=$('splitBox');
  if(F.mode==='equal'){box.innerHTML=`<div class="split-list">${t.members.map(m=>`<label class="srow ${F.include.has(m.id)?'':'off'}" id="sr_${m.id}"><input type="checkbox" id="inc_${m.id}" ${F.include.has(m.id)?'checked':''} onchange="toggleInc('${m.id}',this.checked)"><span class="nm">${esc(m.name)}</span><span class="pv num" id="pv_${m.id}"></span></label>`).join('')}</div>
    <div class="inline"><button class="btn sm plain" onclick="incAll(true)">Everyone</button><button class="btn sm plain" onclick="incAll(false)">Nobody</button></div>`}
  else if(F.mode==='percent'){box.innerHTML=`<div class="split-list">${t.members.map(m=>`<div class="srow"><span class="nm">${esc(m.name)}<br><span class="pv num" id="pv_${m.id}"></span></span><div class="mini"><input id="pc_${m.id}" inputmode="decimal" placeholder="0" value="${esc(F.pct[m.id]||'')}" oninput="F.pct['${m.id}']=this.value;updateForm()" aria-label="${esc(m.name)} percent"><span>%</span></div></div>`).join('')}</div>
    <div class="inline"><button class="btn sm plain" onclick="evenPct()">Split evenly</button></div>`}
  else{box.innerHTML=`<div class="split-list">${t.members.map(m=>`<div class="srow"><span class="nm">${esc(m.name)}</span><div class="mini"><span>₹</span><input id="xa_${m.id}" inputmode="decimal" placeholder="0" value="${esc(F.exact[m.id]||'')}" oninput="F.exact['${m.id}']=this.value;updateForm()" aria-label="${esc(m.name)} amount"></div></div>`).join('')}</div>`}
  updateForm()}
function toggleInc(id,on){on?F.include.add(id):F.include.delete(id);$('sr_'+id).classList.toggle('off',!on);updateForm()}
function incAll(on){trip().members.forEach(m=>{on?F.include.add(m.id):F.include.delete(m.id);const c=$('inc_'+m.id);if(c)c.checked=on;$('sr_'+m.id).classList.toggle('off',!on)});updateForm()}
function evenPct(){const ids=trip().members.map(m=>m.id);const n=ids.length;const base=Math.floor(10000/n);ids.forEach((id,i)=>{F.pct[id]=((i===n-1?10000-base*(n-1):base)/100).toString();$('pc_'+id).value=F.pct[id]});updateForm()}
function validate(){const t=trip();const amt=toPaise(F.amount);if(amt<=0)return{ok:false,msg:'Enter the amount'};
  if(F.mode==='equal'){const k=F.include.size;if(!k)return{ok:false,msg:'Tick at least one person'};const sh=lrm(amt,Object.fromEntries([...F.include].map(i=>[i,1])));return{ok:true,msg:k===1?'One person pays it all':inr(Math.floor(amt/k))+(amt%k?'–'+inr(Math.ceil(amt/k)):'')+' each · '+k+' people',sh}}
  if(F.mode==='percent'){const p={};let tot=0;t.members.forEach(m=>{const v=parseFloat(F.pct[m.id]);if(v>0){p[m.id]=v;tot+=v}});tot=Math.round(tot*100)/100;
    const sh=lrm(amt,p);if(Math.abs(tot-100)>0.001)return{ok:false,msg:`Total is ${tot}%. It needs to add up to 100%.`,sh};return{ok:true,msg:'Total 100% ✓',sh}}
  let tot=0;const sh={};t.members.forEach(m=>{const v=toPaise(F.exact[m.id]);if(v>0){sh[m.id]=v;tot+=v}});const d=amt-tot;
  if(d!==0)return{ok:false,msg:d>0?inr(d)+' still to assign':inr(-d)+' more than the bill',sh};return{ok:true,msg:'Adds up to '+inr(amt)+' ✓',sh}}
function updateForm(){if(!F)return;const v=validate();const st=$('splitStatus');st.textContent=v.msg;st.className='status '+(v.ok?'ok':'bad');$('exSave').disabled=!v.ok;
  if(F.mode!=='exact')trip().members.forEach(m=>{const el=$('pv_'+m.id);if(el)el.textContent=v.sh&&v.sh[m.id]?inr(v.sh[m.id]):(F.mode==='equal'?'—':'')})}
async function saveExpense(){const v=validate();if(!v.ok){toast(v.msg);return}const t=trip();const amt=toPaise(F.amount);
  const e={id:F.id||uid(),kind:'expense',desc:F.desc.trim()||'Expense',amount:amt,paidBy:F.paidBy,mode:F.mode,date:F.date||today(),createdAt:F.createdAt||Date.now()};
  if(F.mode==='equal')e.include=t.members.map(m=>m.id).filter(id=>F.include.has(id));
  else if(F.mode==='percent'){e.pct={};t.members.forEach(m=>{const x=parseFloat(F.pct[m.id]);if(x>0)e.pct[m.id]=x})}
  else{e.exact={};t.members.forEach(m=>{const x=toPaise(F.exact[m.id]);if(x>0)e.exact[m.id]=x})}
  const isEdit=!!F.id;lsSet('tripkitty.payer.'+t.id,F.paidBy);
  try{await ST.saveExpense(t.id,e)}catch(err){toast(errMsg(err));return}closeSheet();toast(isEdit?'Saved':'Added '+inr(amt))}
async function deleteExpense(){const id=F&&F.id;if(!id)return;const tid=S.tripId;closeSheet();try{await ST.deleteExpense(tid,id);toast('Deleted')}catch(e){toast(errMsg(e))}}

/* settle */
let SF=null;
function openSettle(id,from,to,amount){const t=trip();const ms=t.members;const e=id?S.exps.find(x=>x.id===id):null;
  if(!e&&!from){const tr=settleUp(compute(t,S.exps).net);if(tr.length){from=tr[0].from;to=tr[0].to;amount=tr[0].amount}else{from=ms[0].id;to=(ms[1]||ms[0]).id;amount=0}}
  SF=e?{id:e.id,createdAt:e.createdAt,from:e.paidBy,to:e.to,amount:e.amount,date:e.date}:{from,to,amount:amount||0,date:today()};
  const opts=sel=>ms.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('');
  sheet(`<div class="sheet-h"><h2>${e?'Edit payment':'Record a payment'}</h2><button class="x-btn" onclick="closeSheet()" aria-label="Close">×</button></div>
    <div class="row-2"><div class="field"><label class="label" for="stFrom">Who paid</label><select class="input" id="stFrom">${opts(SF.from)}</select></div>
      <div class="field"><label class="label" for="stTo">Paid to</label><select class="input" id="stTo">${opts(SF.to)}</select></div></div>
    <div class="field"><label class="label" for="stAmt">Amount</label><div class="money"><span>₹</span><input id="stAmt" inputmode="decimal" value="${SF.amount?(SF.amount/100).toString():''}" placeholder="0"></div></div>
    <div class="field"><label class="label" for="stDate">Date</label><input class="input" type="date" id="stDate" value="${SF.date}"></div>
    <div class="foot-actions"><button class="btn block" onclick="saveSettle()">${e?'Save changes':'Record payment'}</button>
      ${e?`<button class="btn danger block" onclick="armDelete(this,deleteSettle)">Delete payment</button>`:''}</div>
    <p class="note">Recording a payment moves the balance; it doesn't send any money.</p>`)}
async function saveSettle(){const from=$('stFrom').value,to=$('stTo').value,amt=toPaise($('stAmt').value);
  if(from===to){toast('Pick two different people');return}if(amt<=0){toast('Enter the amount');return}
  const e={id:SF.id||uid(),kind:'settle',desc:'Payment',amount:amt,paidBy:from,to,date:$('stDate').value||today(),createdAt:SF.createdAt||Date.now()};
  const t=trip();try{await ST.saveExpense(t.id,e)}catch(err){toast(errMsg(err));return}closeSheet();SF=null;toast(mname(t,from)+' paid '+mname(t,to)+' '+inr(amt))}
async function deleteSettle(){const id=SF&&SF.id;if(!id)return;const tid=S.tripId;closeSheet();try{await ST.deleteExpense(tid,id);toast('Deleted')}catch(e){toast(errMsg(e))}}

boot();
</script>
